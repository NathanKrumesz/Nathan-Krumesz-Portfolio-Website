<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1920 1080' width='1920' height='1080'>
  <defs>
    <!-- Background Gradients replicating the user image -->
    <radialGradient id='blueGlow' cx='22%' cy='28%' r='65%'>
      <stop offset='0%' stop-color='#6a70ff' stop-opacity='1'/>
      <stop offset='35%' stop-color='#5256f3' stop-opacity='0.95'/>
      <stop offset='70%' stop-color='#373ac9' stop-opacity='0.8'/>
      <stop offset='100%' stop-color='#202298' stop-opacity='0.2'/>
    </radialGradient>
    <radialGradient id='centerDeep' cx='45%' cy='55%' r='55%'>
      <stop offset='0%' stop-color='#4548e6' stop-opacity='0.9'/>
      <stop offset='50%' stop-color='#3033bf' stop-opacity='0.85'/>
      <stop offset='100%' stop-color='#1a1c78' stop-opacity='0.4'/>
    </radialGradient>
    <linearGradient id='shadowRight' x1='40%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#3b3ecb' stop-opacity='0'/>
      <stop offset='45%' stop-color='#262744' stop-opacity='0.75'/>
      <stop offset='70%' stop-color='#1b1c2e' stop-opacity='0.92'/>
      <stop offset='100%' stop-color='#111220' stop-opacity='0.98'/>
    </linearGradient>
    <linearGradient id='bottomShadow' x1='0%' y1='50%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#000000' stop-opacity='0'/>
      <stop offset='100%' stop-color='#0a0b16' stop-opacity='0.55'/>
    </linearGradient>

    <!-- Noise filter for photographic film grain -->
    <filter id='noise' x='0%' y='0%' width='100%' height='100%'>
      <feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch' result='turb'/>
      <feColorMatrix type='matrix' values='
        3.5 0 0 0 -1.2
        0 3.5 0 0 -1.2
        0 0 3.5 0 -1.2
        0 0 0 0.85 0' result='grain'/>
      <feBlend mode='overlay' in='SourceGraphic' in2='grain'/>
    </filter>
  </defs>

  <!-- Base deep indigo background -->
  <rect width='1920' height='1080' fill='#252799'/>

  <!-- Left vibrant blue illumination -->
  <rect width='1920' height='1080' fill='url(#blueGlow)'/>
  <rect width='1920' height='1080' fill='url(#centerDeep)'/>

  <!-- Right shadowy dark vertical zone -->
  <rect width='1920' height='1080' fill='url(#shadowRight)'/>
  <rect width='1920' height='1080' fill='url(#bottomShadow)'/>

  <!-- Subtle Matrix / Binary Watermark Layer -->
  <g fill='#ffffff' opacity='0.085' font-family='monospace' font-size='32' font-weight='500' letter-spacing='8'>

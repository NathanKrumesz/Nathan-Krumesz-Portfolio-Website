  <!-- Surface Texture Filter Overlay -->
  <rect width='1920' height='1080' fill='#808080' filter='url(#noise)' mix-blend-mode='overlay' opacity='0.62'/>
  <rect width='1920' height='1080' fill='#808080' filter='url(#noise)' mix-blend-mode='soft-light' opacity='0.45'/>

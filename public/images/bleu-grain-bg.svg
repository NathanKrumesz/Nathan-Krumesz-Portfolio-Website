  <text x='-40' y='587'>01010000 01100101 01110010 01100110 01101111 01110010 01101101 01010000 01100101 01110010 01100110 01101111 01110010 01101101</text>
  <text x='-40' y='645'>01000001 01110101 01100100 01101001 01100101 01101110 01100011 01000001 01110101 01100100 01101001 01100101 01101110 01100011</text>
